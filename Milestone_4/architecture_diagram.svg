<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1350" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <!-- Cylinder filter & gradients -->
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent-gemini" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-rag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { fill: #f8fafc; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .subtitle-text { fill: #94a3b8; font-size: 12px; font-weight: 400; }
    .node-title { fill: #f1f5f9; font-size: 13.5px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .node-desc { fill: #94a3b8; font-size: 10px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; }
    .container-title { fill: #cbd5e1; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .link-line { stroke: #38bdf8; stroke-width: 1.8; fill: none; }
    .link-dash { stroke: #f59e0b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
    .link-dim { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .badge-text { fill: #38bdf8; font-size: 10px; font-weight: 600; font-family: monospace; }
  </style>

  <!-- Canvas Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="title-text">🧠 SynthAI Enterprise — System Architecture &amp; Dataflow</text>
    <text x="0" y="22" class="subtitle-text">High-Fidelity Multi-Source Meeting Intelligence, Dual-LLM Synthesis &amp; Hybrid Semantic RAG Engine</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: MULTI-PLATFORM INGESTION & AUDIO PROCESSING LAYER      -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(60, 85)">
    <!-- Container Box -->
    <rect x="0" y="0" width="980" height="155" rx="8" fill="#131926" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 0 0 L 980 0 L 980 32 L 0 32 Z" fill="#1e293b" rx="8" />
    <text x="20" y="21" class="container-title">1. MULTI-PLATFORM INGESTION &amp; AUDIO PROCESSING PIPELINE</text>

    <!-- Source 1: Local Upload -->
    <rect x="25" y="48" width="180" height="52" rx="6" fill="#1a2234" stroke="#334155" stroke-width="1.2" />
    <text x="115" y="68" class="node-title">Local Media Upload</text>
    <text x="115" y="86" class="node-desc">MP4, MP3, WAV, M4A</text>

    <!-- Source 2: Zoom Cloud -->
    <rect x="230" y="48" width="180" height="52" rx="6" fill="#1a2234" stroke="#334155" stroke-width="1.2" />
    <text x="320" y="68" class="node-title">Zoom Cloud Sync</text>
    <text x="320" y="86" class="node-desc">OAuth + Webhooks + CRC</text>

    <!-- Source 3: Google Meet -->
    <rect x="435" y="48" width="180" height="52" rx="6" fill="#1a2234" stroke="#334155" stroke-width="1.2" />
    <text x="525" y="68" class="node-title">Google Meet Drive</text>
    <text x="525" y="86" class="node-desc">Drive API + Auto Ingestion</text>

    <!-- ASR: Whisper Speech-to-Text -->
    <rect x="655" y="48" width="145" height="52" rx="6" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
    <text x="727" y="68" class="node-title">Whisper ASR</text>
    <text x="727" y="86" class="node-desc">Timestamps &amp; Text</text>

    <!-- Diarization: PyAnnote -->
    <rect x="820" y="48" width="135" height="52" rx="6" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
    <text x="887" y="68" class="node-title">PyAnnote Audio</text>
    <text x="887" y="86" class="node-desc">Speaker Diarization</text>

    <!-- Horizontal Connectors in Layer 1 -->
    <path d="M 615 74 L 655 74" class="link-line" marker-end="url(#arrow-blue)" />
    <path d="M 800 74 L 820 74" class="link-line" marker-end="url(#arrow-blue)" />
    <!-- Converging lines from 3 inputs to Whisper -->
    <path d="M 115 100 L 115 125 L 635 125 L 635 85 L 655 85" class="link-dim" marker-end="url(#arrow-gray)" />
    <path d="M 320 100 L 320 125" class="link-dim" />
    <path d="M 525 100 L 525 125" class="link-dim" />

    <text x="490" y="142" class="node-desc" fill="#64748b">Normalized 16kHz Audio Stream ➔ Segmented Transcript with Speaker Attribution</text>
  </g>

  <!-- Connector: Layer 1 to Layer 2 (Gemini Primary) -->
  <path d="M 887 240 L 887 265 L 550 265 L 550 285" class="link-line" marker-end="url(#arrow-blue)" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: LLM SYNTHESIS & STRUCTURED INSIGHT EXTRACTION           -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(60, 285)">
    <!-- Container Box -->
    <rect x="0" y="0" width="980" height="235" rx="8" fill="#131926" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 0 0 L 980 0 L 980 32 L 0 32 Z" fill="#1e293b" rx="8" />
    <text x="20" y="21" class="container-title">2. AI SYNTHESIS &amp; INSIGHT EXTRACTION (PRIMARY &amp; FALLBACK)</text>

    <!-- Gemini Primary Node -->
    <g transform="translate(425, 45)">
      <rect x="0" y="0" width="250" height="48" rx="6" fill="#1e2238" stroke="#818cf8" stroke-width="1.8" filter="url(#glow-blue)" />
      <text x="125" y="24" class="node-title" fill="#a5b4fc">✨ Gemini Primary</text>
      <text x="125" y="38" class="badge-text" fill="#818cf8">gemini-2.0-flash / 1.5-pro</text>
    </g>

    <!-- Fallback indicator & path -->
    <path d="M 470 93 L 470 120" class="link-dash" marker-end="url(#arrow-dash)" />
    <rect x="430" y="99" width="80" height="18" rx="3" fill="#2d1c0a" stroke="#d97706" stroke-width="0.8" />
    <text x="470" y="111" class="node-desc" fill="#f59e0b" font-weight="600">Fallback</text>

    <!-- OpenAI / Local Fallback Node -->
    <g transform="translate(375, 120)">
      <rect x="0" y="0" width="190" height="42" rx="6" fill="#1c1f2e" stroke="#64748b" stroke-width="1.2" />
      <text x="95" y="21" class="node-title">OpenAI / Local Fallback</text>
      <text x="95" y="34" class="node-desc">Heuristics / Offline Recovery</text>
    </g>

    <!-- Merge Paths down to Structured Insights -->
    <!-- From Gemini Primary -->
    <path d="M 625 93 L 625 178 L 575 178" class="link-line" />
    <!-- From Fallback -->
    <path d="M 470 162 L 470 178 L 575 178" class="link-line" />
    <path d="M 575 178 L 575 186" class="link-line" marker-end="url(#arrow-blue)" />

    <!-- Structured JSON Insights Node -->
    <g transform="translate(240, 186)">
      <rect x="0" y="0" width="500" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" />
      <text x="250" y="19" class="node-title" fill="#e0f2fe">📋 Structured JSON Insights: Decisions, Action Items, Topics, Sentiment</text>
    </g>
  </g>

  <!-- Connector: Layer 2 to Layer 3 (Split to SQLite and Chunking) -->
  <path d="M 330 509 L 330 535 L 210 535 L 210 575" class="link-line" marker-end="url(#arrow-blue)" />
  <path d="M 650 509 L 650 535 L 775 535 L 775 575" class="link-line" marker-end="url(#arrow-blue)" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: KNOWLEDGE BASE & RAG LAYER (EXACT REPLICA OF DIAGRAM)  -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(60, 560)">
    <!-- Container Box -->
    <rect x="0" y="0" width="980" height="520" rx="8" fill="#111726" stroke="#334155" stroke-width="1.8" />
    <path d="M 0 0 L 980 0 L 980 34 L 0 34 Z" fill="#1e293b" rx="8" />
    <text x="20" y="22" class="container-title">3. Knowledge Base &amp; RAG Layer</text>

    <!-- ──────────────────────────────────────────────────────────── -->
    <!-- Column 1 (Left): SQLite Metadata DB Cylinder -->
    <!-- ──────────────────────────────────────────────────────────── -->
    <g transform="translate(60, 55)">
      <!-- Cylinder Top Ellipse -->
      <path d="M 0 15 C 0 5, 200 5, 200 15 C 200 25, 0 25, 0 15 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
      <!-- Cylinder Body -->
      <path d="M 0 15 L 0 55 C 0 65, 200 65, 200 55 L 200 15 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <!-- Cylinder Base Curve -->
      <path d="M 0 55 C 0 65, 200 65, 200 55" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="100" y="38" class="node-title" fill="#f8fafc">🗄️ SQLite Metadata DB</text>
      <!-- Subtitle badge below -->
      <text x="100" y="80" class="node-desc">Meetings, Users, Auth, History</text>
    </g>

    <!-- ──────────────────────────────────────────────────────────── -->
    <!-- Column 2 (Center): User Search Query Flow -->
    <!-- ──────────────────────────────────────────────────────────── -->
    <!-- User Search Query Box -->
    <g transform="translate(340, 55)">
      <rect x="0" y="0" width="220" height="45" rx="6" fill="#1a2234" stroke="#475569" stroke-width="1.4" />
      <text x="110" y="23" class="node-title">🔍 User Search Query</text>
    </g>

    <!-- Arrow down to Query Embedding -->
    <path d="M 450 100 L 450 135" class="link-line" marker-end="url(#arrow-blue)" />

    <!-- Query Embedding Box -->
    <g transform="translate(340, 135)">
      <rect x="0" y="0" width="220" height="45" rx="6" fill="#1e1e38" stroke="#818cf8" stroke-width="1.4" />
      <text x="110" y="23" class="node-title">⚡ Query Embedding</text>
    </g>

    <!-- ──────────────────────────────────────────────────────────── -->
    <!-- Column 3 (Right): Transcript & Insight Chunking Flow -->
    <!-- ──────────────────────────────────────────────────────────── -->
    <!-- Transcript & Insight Chunking Box -->
    <g transform="translate(640, 55)">
      <rect x="0" y="0" width="270" height="45" rx="6" fill="#1a2234" stroke="#475569" stroke-width="1.4" />
      <text x="135" y="23" class="node-title">📄 Transcript &amp; Insight Chunking</text>
    </g>

    <!-- Arrow down to Sentence-Transformers -->
    <path d="M 775 100 L 775 135" class="link-line" marker-end="url(#arrow-blue)" />

    <!-- Sentence-Transformers Embeddings Box -->
    <g transform="translate(640, 135)">
      <rect x="0" y="0" width="270" height="45" rx="6" fill="#1e1e38" stroke="#818cf8" stroke-width="1.4" />
      <text x="135" y="23" class="node-title">🧠 Sentence-Transformers Embeddings</text>
      <text x="135" y="37" class="badge-text" fill="#a5b4fc">all-MiniLM-L6-v2 (384-dim)</text>
    </g>

    <!-- ──────────────────────────────────────────────────────────── -->
    <!-- Both Embeddings point to ChromaDB Vector Store Cylinder -->
    <!-- ──────────────────────────────────────────────────────────── -->
    <path d="M 450 180 L 450 205 L 590 205 L 590 220" class="link-line" />
    <path d="M 775 180 L 775 205 L 590 205 L 590 220" class="link-line" marker-end="url(#arrow-blue)" />

    <g transform="translate(460, 220)">
      <!-- Cylinder Top Ellipse -->
      <path d="M 0 16 C 0 5, 260 5, 260 16 C 260 27, 0 27, 0 16 Z" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Cylinder Body -->
      <path d="M 0 16 L 0 56 C 0 67, 260 67, 260 56 L 260 16 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Cylinder Base Curve -->
      <path d="M 0 56 C 0 67, 260 67, 260 56" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="130" y="38" class="node-title" fill="#38bdf8">🔮 ChromaDB Vector Store</text>
      <text x="130" y="80" class="node-desc">Persistent HNSW Cosine Similarity Index</text>
    </g>

    <!-- Arrow down to Retrieved Semantic Context -->
    <path d="M 590 286 L 590 315" class="link-line" marker-end="url(#arrow-blue)" />

    <!-- Retrieved Semantic Context Box -->
    <g transform="translate(440, 315)">
      <rect x="0" y="0" width="300" height="45" rx="6" fill="#1a2234" stroke="#475569" stroke-width="1.4" />
      <text x="150" y="23" class="node-title">📑 Retrieved Semantic Context</text>
      <text x="150" y="37" class="badge-text" fill="#38bdf8">Top-K Chunks + Metadata Filter</text>
    </g>

    <!-- Arrow down to Gemini RAG -->
    <path d="M 590 360 L 590 390" class="link-line" marker-end="url(#arrow-blue)" />

    <!-- Gemini RAG Box -->
    <g transform="translate(480, 390)">
      <rect x="0" y="0" width="220" height="45" rx="6" fill="#1e2238" stroke="#818cf8" stroke-width="1.8" filter="url(#glow-blue)" />
      <text x="110" y="23" class="node-title" fill="#a5b4fc">🤖 Gemini RAG</text>
      <text x="110" y="37" class="badge-text" fill="#818cf8">Context Grounded Generation</text>
    </g>

    <!-- Arrow down to Grounded Answer with Sources -->
    <path d="M 590 435 L 590 465" class="link-line" marker-end="url(#arrow-blue)" />

    <!-- Grounded Answer with Sources Box -->
    <g transform="translate(420, 465)">
      <rect x="0" y="0" width="340" height="45" rx="6" fill="#0f291e" stroke="#10b981" stroke-width="1.6" />
      <text x="170" y="23" class="node-title" fill="#6ee7b7">🎯 Grounded Answer with Sources</text>
      <text x="170" y="37" class="badge-text" fill="#34d399">Strict Citations: [Source: Meeting #ID, Timestamp]</text>
    </g>
  </g>

  <!-- Connector: Layer 3 to Layer 4 (Application & Export) -->
  <path d="M 590 1080 L 590 1115" class="link-line" marker-end="url(#arrow-blue)" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: APPLICATION & INTERFACE DELIVERY LAYER                  -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(60, 1115)">
    <!-- Container Box -->
    <rect x="0" y="0" width="980" height="155" rx="8" fill="#131926" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 0 0 L 980 0 L 980 32 L 0 32 Z" fill="#1e293b" rx="8" />
    <text x="20" y="21" class="container-title">4. APPLICATION DELIVERY, ACCESS CONTROL &amp; REPORTS</text>

    <!-- Streamlit Dashboard -->
    <g transform="translate(40, 52)">
      <rect x="0" y="0" width="280" height="65" rx="6" fill="#1a2234" stroke="#ff4b4b" stroke-width="1.3" />
      <text x="140" y="26" class="node-title">🎨 Streamlit Dashboard (Port 8501)</text>
      <text x="140" y="44" class="node-desc">Meetings, Analytics, RAG UI, Sync Controls</text>
      <text x="140" y="56" class="badge-text" fill="#ff4b4b">Active Frontend</text>
    </g>

    <!-- FastAPI Backend -->
    <g transform="translate(350, 52)">
      <rect x="0" y="0" width="280" height="65" rx="6" fill="#1a2234" stroke="#009688" stroke-width="1.3" />
      <text x="140" y="26" class="node-title">⚡ FastAPI Backend (Port 8000)</text>
      <text x="140" y="44" class="node-desc">REST API, JWT Auth, Webhooks, Swagger /docs</text>
      <text x="140" y="56" class="badge-text" fill="#2dd4bf">Active Daemon</text>
    </g>

    <!-- Executive Reports -->
    <g transform="translate(660, 52)">
      <rect x="0" y="0" width="280" height="65" rx="6" fill="#1a2234" stroke="#38bdf8" stroke-width="1.3" />
      <text x="140" y="26" class="node-title">📑 Executive Reports &amp; Export</text>
      <text x="140" y="44" class="node-desc">High-Fidelity PDF + RFC-4180 CSV</text>
      <text x="140" y="56" class="badge-text" fill="#38bdf8">Direct Base64 &amp; Stream</text>
    </g>

    <text x="490" y="140" class="node-desc" fill="#64748b">Multi-Tenant RBAC Isolation &bull; Bcrypt Password Hashing &bull; Sub-Second Vector Retrieval SLA</text>
  </g>
</svg>
